name: Deploy website (GitHub Pages)
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Tests must pass before going live
        run: npm test
      - name: Publish to gh-pages branch
        run: |
          mkdir _site && cp -r index.html simulators _site/ && touch _site/.nojekyll
          cd _site && git init -q -b gh-pages && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@github.com" commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
